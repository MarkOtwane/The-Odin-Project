<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Document</title>
		<link rel="stylesheet" href="styles.css" />
	</head>
	<body>
		<div class="main">
			<div class="left">
				<img class="back-image" src="assets/image.png" alt="leaf image" />
				<img class="logo" src="assets/image copy.png" alt="odin logo" />
			</div>
			<div class="right">
				<div class="paragraph">
					<p>
						This is not a real online service! You know you need something <br />like this in your to help you realize your deepest dreams. <br />
						Sign up now to get started
					</p>
					<p>You know you want to.</p>
				</div>
				<div class="mid-section">
					<h6>Lets do this</h6>
					<form action="">
						<div class="forms">
							<div class="common"><label for="first_name">FIRST NAME</label> <input type="text" name="first_name" id="first_name" required /></div>
							<div class="common"><label for="last_name">LAST NAME</label> <input type="text" name="last_name" id="last_name" required /></div>
							<div class="common"><label for="email">EMAIL</label> <input type="email" name="email" id="email" required /></div>
							<div class="common"><label for="phone_number">PHONE NUMBER</label> <input type="number" name="phone_number" id="phone_number" required /></div>
							<div class="common"><label for="password">PASSWORD</label> <input type="password" name="password" id="password" required /></div>
							<div class="common"><label for="con_password">CONFIRM PASSWORD</label> <input type="password" name="con_password" id="con_password" required /></div>
						</div>

						<button type="submit">Create Account</button>
					</form>
					<span>Already have an account? <a href="#">Log in</a></span>
				</div>
			</div>
		</div>
	</body>
</html>
